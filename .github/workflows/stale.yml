name: "Close Stale Issues"
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: 

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue is stale because it has been open 30 days with no activity."
          days-before-stale: 1
          days-before-close: 1
