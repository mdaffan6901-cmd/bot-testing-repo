name: Trigger All Contributors Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Bot Contribution
        run: |
          echo "Maintained by All-Contributors" >> CONTRIBUTORS.md

      - name: Commit as all-contributors[bot]
        run: |
          git config --global user.name "all-contributors[bot]"
          git config --global user.email "36465431+all-contributors[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md
          git commit -m "docs: add contributors list [skip ci]" || exit 0
          git push
